<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TextLab — paste, clean, export</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#e6edf3; --dim:#8b949e; --accent:#4a9eff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
  header { padding:22px 20px 6px; }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  p.sub { margin:4px 0 0; color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 20px 24px; }
  @media (max-width:820px){ main { grid-template-columns:1fr; } }
  textarea { width:100%; height:56vh; resize:vertical; padding:12px; border:1px solid var(--line);
             border-radius:8px; background:var(--panel); color:var(--fg); font:13px/1.55 ui-monospace,Consolas,monospace; }
  textarea:focus { outline:1px solid var(--accent); }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 6px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:0 20px 28px; }
  button { padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:var(--panel);
           color:var(--fg); font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  #stats { color:var(--dim); font-size:12px; margin-left:auto; }
</style>
</head>
<body>
<header>
  <h1>TextLab</h1>
  <p class="sub">Paste text. Invisible characters stripped; semicolons, hyphens and dashes become ", ". Export as TXT, Markdown or HTML.</p>
</header>

<main>
  <div><label for="in">Paste here</label><textarea id="in" placeholder="Paste your text&hellip;" autofocus></textarea></div>
  <div><label for="out">Cleaned</label><textarea id="out" readonly></textarea></div>
</main>

<div class="bar">
  <button id="copy">Copy</button>
  <button data-ext="txt" data-type="text/plain">Download .txt</button>
  <button data-ext="md" data-type="text/markdown">Download .md</button>
  <button data-ext="html" data-type="text/html">Download .html</button>
  <button id="clear">Clear</button>
  <span id="stats"></span>
</div>

<script>
// Invisible / zero-width / bidi / control characters, including the ones LLMs emit.
const INVISIBLE = new RegExp(
  '[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F-\\u009F]' +  // controls (keeps \t and \n)
  '|[\\u00AD\\u034F\\u061C\\u115F\\u1160\\u17B4\\u17B5]' +           // soft hyphen, joiners, hangul/khmer fillers
  '|[\\u180B-\\u180F\\u200B-\\u200F\\u202A-\\u202E]' +               // zero-width chars, bidi marks/overrides
  '|[\\u2060-\\u2064\\u2066-\\u206F\\u3164]' +                       // word joiner, invisible operators
  '|[\\uFE00-\\uFE0F\\uFEFF\\uFFA0\\uFFF9-\\uFFFB]' +                // variation selectors, BOM, halfwidth filler
  '|\\uDB40[\\uDC00-\\uDDEF]', 'g');                                 // U+E0000 tag block
// Unicode spaces that aren't a plain space.
const ODD_SPACE = new RegExp('[\\u00A0\\u1680\\u2000-\\u200A\\u202F\\u205F\\u3000]', 'g');
// Semicolons plus every dash flavour.
const PUNCT = new RegExp('[;\\u002D\\u058A\\u1400\\u1806\\u2010-\\u2015\\u2212\\u2E3A\\u2E3B\\uFE58\\uFE63\\uFF0D]', 'g');

function clean(s) {
  return s.replace(INVISIBLE, '')
    .replace(ODD_SPACE, ' ')
    .normalize('NFC')
    .replace(PUNCT, ', ')
    .replace(/[ \t]*,(?:[ \t]*,)+/g, ',')   // collapse runs of inserted commas
    .replace(/[ \t]+,/g, ',')               // no space before a comma
    .replace(/,(\S)/g, ', $1')              // always a space after
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/[ \t]+$/gm, '')               // trailing whitespace, incl. ", " at line end
    .replace(/\r\n?/g, '\n');
}

const $in = document.getElementById('in'), $out = document.getElementById('out');
function run() {
  $out.value = clean($in.value);
  document.getElementById('stats').textContent =
    $in.value.length + ' in / ' + $out.value.length + ' out';
}
$in.addEventListener('input', run);

function wrap(text, ext) {
  if (ext !== 'html') return text;   // .txt and .md share the same plain body
  const esc = text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return '<!doctype html>\n<meta charset="utf-8">\n<title>TextLab export</title>\n<pre>' + esc + '</pre>\n';
}

document.querySelectorAll('button[data-ext]').forEach(b => b.onclick = () => {
  const blob = new Blob([wrap($out.value, b.dataset.ext)], { type: b.dataset.type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'textlab.' + b.dataset.ext;
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('copy').onclick = () => navigator.clipboard.writeText($out.value);
document.getElementById('clear').onclick = () => { $in.value = ''; run(); $in.focus(); };
run();
</script>
</body>
</html>
